<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    

    <div class="container">
        <h1>Sign Up</h1>
        <input type="text" id="user-name" placeholder="User Name" maxlength="12" required>
        <p id="userP">Username must be  and contain 5 - 12 characters</p>
        <input type="email" id="email" placeholder="email" required>
        <p>Email must be a valid address, e.g. me@mydomain.com</p>
        <input type="password" id="password" placeholder="Enter password" required>
         <p>Password must alphanumeric (@, _ and - are also allowed) and be 8 - 20 characters</p>
        <input type="text" id="number" placeholder="Enter Phone number" required>
         <p>Telephone must be a valid UK telephone number (11 digits)</p>
    </div>
   


    <script src="script.js"></script>
</body>
</html>
