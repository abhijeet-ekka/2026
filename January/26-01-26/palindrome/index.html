<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    
   <div class="cantiner">
        <h1 class="heading">Is it a Palindrome?</h1>
        <section class="input">
            <label for="text-input">Enter in text to check for a palindrome:</label>
            <div class="btn">
                <div class="inputs_buttons">
                <input type="text" id="text-input">
                <button id="check-btn">Check</button>                   
                </div>
                <p id="result"></p>
                </div>
            
        </section>
        <section class="instructions"><p>💡 A <span>palindrome</span> is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p></section>
    </div>

    <script src="script.js"></script>
</body>

</html>
