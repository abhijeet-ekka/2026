<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="cantiner">
        <h1 class="heading">Is it a Palindrome?</h1>
        <section class="input">
            <label for="word">Enter in text to check for a palindrome:</label>
            <div class="btn">
                <input type="text" id="word">
                <button>Check</button>
            </div>
            
        </section>
        <section class="instructions"><p>💡 A <span>palindrome</span> is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p></section>
    </div>

    <script src="script.js"></script>
</body>
</html>
